title: "Zhenjian Wu"
description: "Bilingual academic homepage with English as the default entry and a complete Chinese mirror page."
baseurl: "/wuzhenjian.github.io"
url: "https://zhaoxingxing0125.github.io"
repository: "zhaoxingxing0125/wuzhenjian.github.io"
lang: en
timezone: Asia/Shanghai
markdown: kramdown
permalink: pretty
include:
  - _pages
exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock

collections:
  publications:
    output: false
  projects:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true
